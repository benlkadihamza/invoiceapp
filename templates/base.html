<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Générateur de Factures{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Factures">
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
    <meta name="theme-color" content="#4472C4">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if session.user_id %}
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-brand">Cocina Espa&ntilde;ola</a>
            <div class="nav-links">
                <a href="/">Accueil</a>
                <a href="/invoices">Factures</a>
                <a href="/change-password">Changer mot de passe</a>
                <a href="/logout">D&eacute;connexion</a>
            </div>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.error('SW failed:', err));
        });
      }
    </script>
</body>
</html>
